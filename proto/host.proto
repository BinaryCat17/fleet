syntax = "proto3";

package host;

import "common.proto";

service Host {

  // ═══════════════════════ feature: ORDERS ══════════════════════════════

  rpc PlaceOrders  (PlaceOrdersRequest)  returns (stream common.ItemResult) {
    option idempotency_level = IDEMPOTENT;
  }

  rpc RemoveOrders (common.RemoveRequest) returns (stream common.ItemResult) {
    option idempotency_level = IDEMPOTENT;
  }

  rpc ListOrders   (ListOrdersRequest) returns (stream OrderEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ═══════════════════════ feature: BUDGETS ═════════════════════════════

  rpc PlaceBudgets (PlaceBudgetsRequest) returns (stream common.ItemResult) {
    option idempotency_level = IDEMPOTENT;
  }

  rpc RemoveBudgets(common.RemoveRequest) returns (stream common.ItemResult) {
    option idempotency_level = IDEMPOTENT;
  }

  rpc ListBudgets  (ListBudgetsRequest) returns (stream BudgetEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ═══════════════════════ feature: SPECS ═══════════════════════════════

  rpc PlaceSpecs   (PlaceSpecsRequest)   returns (stream common.ItemResult) {
    option idempotency_level = IDEMPOTENT;
  }

  rpc RemoveSpecs  (common.RemoveRequest) returns (stream common.ItemResult) {
    option idempotency_level = IDEMPOTENT;
  }

  rpc ListSpecs    (ListSpecsRequest) returns (stream SpecEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ═══════════════════════ feature: KNOWN_MACHINES ═══════════════════════════════
  
  rpc ListKnownMachines    (ListKnownMachinesRequest)    returns (stream KnownMachineEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ═══════════════════════ feature: SHIPS ═══════════════════════════════

  rpc ListShips    (ListShipsRequest)    returns (stream ShipEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc RenewShips   (RenewShipsRequest)   returns (stream common.ItemResult) {
    option idempotency_level = IDEMPOTENT;
  }

  // ═══════════════════════ feature: STATUSES ═════════════════════════════
  
  rpc ListStatuses (ListStatusesRequest) returns (stream StatusEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ═══════════════════════ feature: ALARMS ═════════════════════════════
  
  rpc ListAlarms (ListAlarmsRequest)    returns (stream AlarmEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ═══════════════════════ feature: LOGS ═════════════════════════════════
  
  rpc ListLogs (ListLogsRequest)     returns (stream LogEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

}

// ═══════════════════════ feature: ORDERS ══════════════════════════════

message Order {
  string id = 1;
  string name = 2;
  string budget_id = 3;
  string spec_id = 4;
}

message PlaceOrdersRequest {
  repeated Order items = 1;
  common.PlaceOptions options = 2;
}

message ListOrdersRequest {
  common.ReadOptions options = 1;
}

message OrderEvent {
  common.EventMeta meta = 1;
  oneof item {
    Order data = 2;
    string deleted_id = 3;
  }
}

// ═══════════════════════ feature: BUDGETS ═════════════════════════════

message Budget {
  string id = 1;
  optional double total_budget = 2;
  optional double max_price_per_hour = 3;
  optional double lease_timeout = 4;
  optional double health_timeout = 5;
}

message PlaceBudgetsRequest {
  repeated Budget items = 1;
  common.PlaceOptions options = 2;
}

message ListBudgetsRequest {
  common.ReadOptions options = 1;
  optional common.Ids filter_to_orders = 2;
}

message BudgetEvent {
  common.EventMeta meta = 1;
  oneof item {
    Budget data = 2; 
    string deleted_id = 3;
  }
}

// ═══════════════════════ feature: SPECS ═══════════════════════════════

message Spec {
  string id = 1;
  optional string gpu_name = 2;
  optional uint32 num_gpus = 3;
  optional uint32 min_cpu_cores = 4;
  optional uint64 min_ram_mb = 5;
  optional uint64 min_disk_gb = 6;
  optional string location = 7;
}

message PlaceSpecsRequest {
  repeated Spec items = 1;
  common.PlaceOptions options = 2;
}

message ListSpecsRequest {
  common.ReadOptions options = 1;
  optional common.Ids to_orders = 2;
}

message SpecEvent {
  common.EventMeta meta = 1;
  oneof item {
    Spec data = 2;
    string deleted_id = 3;
  }
}

// ═══════════════════════ feature: KNOWN_MACHINES ══════════════════════════════

message KnownMachine {
  string id = 1;
  string gpu_name = 2;
  uint32 num_gpus = 3;
  uint32 cpu_cores = 4;
  uint64 ram_mb = 5;
  uint64 disk_gb = 6;
  string location = 7;
}

message ListKnownMachinesRequest {
  common.ReadOptions options = 1;
}

message KnownMachineEvent {
  common.EventMeta meta = 1;
  oneof item {
    KnownMachine data = 2;
    string deleted_id = 3;
  }
}

// ═══════════════════════ feature: SHIPS ══════════════════════════════

message Ship {
  string id = 1;
  string order_id = 2;
  string known_machine_id = 3;
}

message ListShipsRequest {
  common.ReadOptions options = 1;
  optional common.Ids filter_to_orders = 2;
  optional common.Ids filter_to_known_machines = 3;
}

message RenewShipsRequest {
  common.ReadOptions options = 1;
  optional common.Ids filter_to_orders = 2;
  optional common.Ids filter_to_ships = 3;
}

message ShipEvent {
  common.EventMeta meta = 1;
  oneof item {
    Ship data = 2;
    string deleted_id = 3;
  }
}

// ═══════════════════════ feature: STATUSES ══════════════════════════════

enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;
  STATUS_CODE_PENDING = 1;
  STATUS_CODE_PULLING = 2;
  STATUS_CODE_INSTALLING = 3;
  STATUS_CODE_RUNNING = 4;
  STATUS_CODE_STOPPED = 5;
  STATUS_CODE_ERROR = 6;
}

message Status {
  string id = 1;
  string ship_id = 2;
  StatusCode code = 3;
  string message = 4;
}

message ListStatusesRequest {
  common.ReadOptions options = 1;
  optional common.Ids filter_to_ships = 2;
  optional StatusCode filter_code = 3;
}

message StatusEvent {
  common.EventMeta meta = 1;
  oneof item {
    Status data = 2;
    string deleted_id = 3;
  }
}

// ═══════════════════════ feature: ALARMS ══════════════════════════════

enum AlarmCode {
  ALARM_CODE_HEALTHCHECK = 0;
  ALARM_CODE_LEASE = 1;
}

message Alarm {
  string id = 1;
  string ship_id = 2;
  AlarmCode code = 3;
  string message = 4;
}

message ListAlarmsRequest {
  common.ReadOptions options = 1;
  optional common.Ids filter_to_ships = 2;
  optional AlarmCode filter_code = 3;
}

message AlarmEvent {
  common.EventMeta meta = 1;
  oneof item {
    Alarm data = 2;
    string deleted_id = 3;
  }
}

// ═══════════════════════ feature: LOGS ══════════════════════════════

enum LOG_IMPORTANCE {
  LOG_IMPORTANCE_UNSPECIFIED = 0;
  LOG_IMPORTANCE_DEBUG = 1;
  LOG_IMPORTANCE_INFO = 2;
  LOG_IMPORTANCE_WARNING = 3;
  LOG_IMPORTANCE_ERROR = 4;
  LOG_IMPORTANCE_CRITICAL = 5;
}

message Log {
  string id = 1;
  string ship_id = 2;
  LOG_IMPORTANCE importance = 3;
  string source = 4;
  string message = 5;
}

message ListLogsRequest {
  common.ReadOptions options = 1;
  optional common.Ids filter_to_ships = 2;
  optional LOG_IMPORTANCE filter_importance = 3;
  optional string filter_source = 4;
}

message LogEvent {
  common.EventMeta meta = 1;
  oneof item {
    Log data = 2;
    string deleted_id = 3;
  }
}
