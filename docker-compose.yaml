services:
  fleet_provider_vast:
    build: ./fleet_provider_vast
    image: fleet_provider_vast:latest
    ports:
      - "50051:50051"        # optional, for grpcurl debugging
    environment:
      VAST_API_URL: ${VAST_API_URL}
      VAST_API_KEY: ${VAST_API_KEY}        # dev convenience…
    # …production: use a secret file instead of env:
    # secrets:
    #   - vast_api_key

  fleet_host:
    build: ./fleet_host
    image: fleet_host:latest
    environment:
      PROVIDER_URL: http://fleet_provider_vast:50051   # compose DNS name
      DATABASE_PATH: /data/fleet.db
    volumes:
      - fleet-data:/data                # sqlite file persists here
    restart: unless-stopped

volumes:
  fleet-data:

# secrets:                              # production variant
#   vast_api_key:
#     file: ./secrets/vast_api_key.txt
