services:
  fleet-provider-vast:
    build:
      context: .                              # repo root: sdk/rust + proto/ are path-siblings
      dockerfile: fleet-provider-vast/Dockerfile
    image: fleet-provider-vast:latest
    ports:
      - "50051:50051"        # optional, for grpcurl debugging
    environment:
      VAST_API_URL: ${VAST_API_URL}
      VAST_API_KEY: ${VAST_API_KEY}        # dev convenience…
    # …production: use a secret file instead of env:
    # secrets:
    #   - vast_api_key

  fleet-host:
    build:
      context: .
      dockerfile: fleet-host/Dockerfile
    image: fleet-host:latest
    environment:
      PROVIDER_URL: http://fleet-provider-vast:50051   # compose DNS name
      DATABASE_PATH: /data/fleet.db
    volumes:
      - fleet-data:/data                # sqlite file persists here
    restart: unless-stopped

volumes:
  fleet-data:

# secrets:                              # production variant
#   vast_api_key:
#     file: ./secrets/vast_api_key.txt
