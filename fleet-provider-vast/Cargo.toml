[package]
name = "fleet-provider-vast"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# --- the SDK over proto/: generated types + item/map_rows glue ---
fleet-sdk = { path = "../sdk/rust" }                                # common.proto + provider.proto (one codegen pass)
connectrpc = { version = "0.9", features = ["axum"] }              # axum: Router::into_axum_service
connectrpc-health = { version = "0.9", default-features = false }   # server side only
connectrpc-reflection = { version = "0.9", default-features = false }
axum = { version = "0.8", features = ["http2"] }                    # h2c for gRPC clients
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

# --- outbound HTTPS to the VAST API (rustls => no OpenSSL, no system libs) ---
# reqwest 0.13: `rustls` + roots provider; native-certs reads the CA bundle the
# image copies in (see Dockerfile stage 2)
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "json"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
