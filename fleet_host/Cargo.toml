[package]
name = "fleet_host"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# --- ConnectRPC client for the Provider contract ---
connectrpc = { version = "0.9", features = ["client"] }
# --- runtime types referenced by the generated code (same set connectrpc-health uses) ---
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }  # google.protobuf.* (via common.proto)
serde = { version = "1", features = ["derive"] }
http = "1"                            # http::Uri for the provider URL
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

# --- SQLite compiled INTO the binary (no libsqlite3 in the image) ---
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
connectrpc-build = "0.9"
protoc-bin-vendored = "3"       # vendored protoc => no apt/apk, no system deps

[profile.release]
opt-level = "z"                 # image size == binary size on scratch
lto = true
codegen-units = 1
strip = true