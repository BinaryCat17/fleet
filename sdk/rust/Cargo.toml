[package]
name = "fleet-sdk"
version = "0.1.0"
edition = "2021"

# Standalone crate (its own workspace root) so independent images (fleet-host,
# fleet-provider-vast) can vendor & path-depend on it without being merged into
# one Cargo workspace. Each image compiles this crate into its own target dir.
[workspace]

# The proto contract is language-neutral (proto/*.proto); this crate is the
# Rust SDK over it: generated Buffa/ConnectRPC types (`common`, `provider`) plus
# the hand-written glue (`item`, `map_rows`, `DESCRIPTOR_SET`).
# Both protos compile in ONE codegen pass — `provider`'s references to `common`
# resolve in-crate (`super::common::…`), so no `extern_path` mapping is needed.

[dependencies]
# --- runtime types referenced by the generated code (same set connectrpc uses) ---
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }   # google.protobuf.Timestamp
serde = { version = "1", features = ["derive"] }

# --- transport bridge: `From` impls (contract error -> connectrpc status) ---
connectrpc = "0.9"

# --- map_rows: bounded batch fan-out ---
futures = "0.3"

[build-dependencies]
connectrpc-build = "0.9"
protoc-bin-vendored = "3"        # vendored protoc => no apt/apk, no system deps
